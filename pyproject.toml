[tool.ruff]
line-length = 160
target-version = "py310"
extend-exclude = ["bulk", "data", ".cache"]

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, bugbear, pyupgrade, simplify
select = ["F", "E", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E731",  # small lambdas are used deliberately for formatting helpers
    "SIM108",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
